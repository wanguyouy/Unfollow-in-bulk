<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data:; script-src 'self'">
  <title>B 站助手 · 视频下载</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">▶</span>
      <div>
        <div class="brand-name">B 站助手</div>
        <div class="brand-sub">视频下载 · 视频号 · 表情包</div>
      </div>
    </div>
    <div class="topbar-right">
      <button id="openUnfollowBtn" class="btn ghost" title="打开批量取关窗口">批量取关</button>
      <button id="loginChipBtn" class="btn ghost small hidden">登录 B 站</button>
      <div id="account" class="account hidden">
        <img id="avatar" alt="">
        <span id="uname">—</span>
      </div>
    </div>
  </header>

  <main>
    <!-- 视频下载(主功能) -->
    <section class="card">
      <div class="card-head">
        <span class="step step-blue">▶</span><h2>视频下载</h2>
        <span class="badge-soft">B站 / 抖音 / 公众号 / 支付宝 / Telegram</span>
      </div>
      <div class="row" style="align-items: flex-start">
        <textarea id="shareInput" rows="2" class="share-input"
                  placeholder="粘贴链接、分享文案，或 BV 号"></textarea>
        <button id="parseBtn" class="btn primary">解析</button>
      </div>
      <div id="platformBadge" class="plat-badge hidden"></div>
      <div id="parseStatus" class="muted"></div>
      <div id="videoPanel" class="hidden">
        <div id="vTitle" class="vtitle"></div>
        <div id="vMeta" class="muted"></div>
        <div id="imgStrip" class="img-strip hidden"></div>
        <div id="biliOptions" class="grid2 hidden">
          <label id="pageWrap" class="hidden">分 P<select id="pageSel"></select></label>
          <label>清晰度<select id="qualitySel"></select></label>
        </div>
        <div class="row" style="margin-top:12px">
          <button id="downloadBtn" class="btn primary" disabled>选择保存位置并下载</button>
        </div>
        <div class="dl-row">
          <span class="dl-label" id="dlStage">进度</span>
          <div class="progress slim"><div id="dlBar" class="bar bar-blue"></div></div>
          <span id="dlPct" class="muted dl-pct">0%</span>
        </div>
        <div id="dlStatus" class="muted"></div>
      </div>
      <div class="muted" id="dlHint" style="margin-top:12px">B 站高清需登录，其他平台免登录。</div>
    </section>

    <!-- Telegram 本地缓存恢复(离线:解本机 Telegram Desktop 缓存) -->
    <section class="card" id="tgLocalCard">
      <div class="card-head">
        <span class="step step-blue">◱</span><h2>Telegram 本地缓存恢复</h2>
        <span class="badge-soft">离线 · 私密频道也能取</span>
      </div>
      <div class="muted hint">不联网，直接解本机 Telegram Desktop 缓存，私密频道也能导出。</div>
      <div class="row">
        <input id="tglPath" class="share-input" placeholder="tdata 路径（留空自动检测）">
        <button id="tglScanBtn" class="btn primary">扫描本地缓存</button>
      </div>
      <div id="tglFilters" class="row hidden" style="margin-top:10px">
        <label class="check-row"><input id="tglKImage" type="checkbox" checked> 图片 <span id="tglCImage" class="tag">0</span></label>
        <label class="check-row"><input id="tglKVideo" type="checkbox" checked> 视频 <span id="tglCVideo" class="tag">0</span></label>
        <label class="check-row"><input id="tglKAudio" type="checkbox" checked> 语音 <span id="tglCAudio" class="tag">0</span></label>
        <label class="check-row" title="只保留能找到索引、ffmpeg 能解的 mp4。缓存里的 8MB 分片多数属于这一类之外"><input id="tglOnlyPlayable" type="checkbox"> 只看能播的视频</label>
        <label class="check-row" title="表情、头像这类小文件非常多，按体积筛掉更清爽"><input id="tglSkipSmall" type="checkbox"> 隐藏 ≤20KB</label>
        <button id="tglSelAllBtn" class="btn ghost small">全选</button>
        <button id="tglSelNoneBtn" class="btn ghost small">清空</button>
      </div>
      <div class="row hidden" id="tglExportRow" style="margin-top:10px">
        <button id="tglExportBtn" class="btn primary" disabled>导出选中</button>
        <button id="tglPickBtn" class="btn ghost">选择导出目录</button>
        <button id="tglOpenBtn" class="btn ghost hidden">打开导出目录</button>
        <span id="tglDest" class="muted">默认导出到「桌面\Telegram本地缓存」</span>
      </div>
      <div id="tglStatus" class="muted" style="margin-top:8px;user-select:text"></div>
      <div id="tglCount" class="muted"></div>
      <div id="tglList" class="tgl-grid tgl-scroll"></div>
      <div class="dl-row hidden" id="tglProgressWrap">
        <span class="dl-label" id="tglStage">进度</span>
        <div class="progress slim"><div id="tglBar" class="bar bar-blue"></div></div>
        <span id="tglPct" class="muted dl-pct"></span>
      </div>
      <div id="tglLog" class="wxlog"></div>
    </section>

    <!-- 微信视频号(实验:捕获原始流直存,不解密) -->
    <section class="card" id="wxCard">
      <div class="card-head">
        <span class="step step-blue">⬇</span><h2>微信视频号下载</h2>
        <span class="badge-soft">实验 · 直存原始流</span>
      </div>
      <div class="muted">退出微信 → 清缓存 → 启动捕获 → 播放视频。</div>
      <div class="row" style="margin-top:12px">
        <button id="wxStartBtn" class="btn primary">启动捕获</button>
        <button id="wxStopBtn" class="btn ghost hidden">停止捕获</button>
        <button id="wxCertBtn" class="btn ghost">安装证书</button>
        <button id="wxCertOffBtn" class="btn ghost" title="从当前用户根证书库移除本应用的本地根证书">卸载证书</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="wxCacheInfoBtn" class="btn ghost small">缓存诊断</button>
        <button id="wxCacheClearBtn" class="btn ghost small">清 WebView 缓存(可恢复)</button>
        <button id="wxCacheRestoreBtn" class="btn ghost small">恢复缓存</button>
        <button id="wxDbKeyBtn" class="btn ghost small">从本地缓存补 key</button>
        <button id="wxClearAllBtn" class="btn ghost small">清除捕获记录</button>
      </div>
      <div id="wxStatus" class="muted" style="margin-top:8px;user-select:text"></div>
      <div id="wxLog" class="wxlog"></div>
      <div id="wxList"></div>
    </section>

    <!-- 微信表情包导出 -->
    <section class="card" id="emojiCard">
      <div class="card-head">
        <span class="step step-blue">★</span><h2>表情包导出</h2>
        <span class="badge-soft">微信收藏表情</span>
      </div>
      <div class="muted">导出微信收藏表情，首次自动下载工具，杀软弹窗请放行。</div>
      <div id="emojiStatus" class="muted" style="margin-top:8px;user-select:text"></div>
      <div class="row" style="margin-top:12px">
        <button id="emojiCheckBtn" class="btn primary">检测环境</button>
        <select id="emojiAccount" class="hidden" style="max-width:240px"></select>
        <button id="emojiPickDirBtn" class="btn ghost">选择导出目录</button>
        <button id="emojiZipBtn" class="btn ghost small" title="自动下载失败时,从手动下载的官方 zip 安装">从本地 zip 安装</button>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="check-row"><input id="emojiFlat" type="checkbox"> 不分组(全部放同一文件夹)</label>
        <label class="check-row" title="中断后再次导出时,已下载的表情不会重复下载"><input id="emojiSkip" type="checkbox" checked> 跳过已存在(可断点续跑)</label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="emojiExportBtn" class="btn primary" disabled>开始导出</button>
        <button id="emojiStopBtn" class="btn ghost hidden">停止</button>
        <button id="emojiOpenBtn" class="btn ghost hidden">打开导出目录</button>
        <span id="emojiOutDir" class="muted" style="user-select:text"></span>
      </div>
      <div class="dl-row hidden" id="emojiProgressWrap">
        <span class="dl-label" id="emojiStage">进度</span>
        <div class="progress slim"><div id="emojiBar" class="bar bar-blue"></div></div>
        <span id="emojiPct" class="muted dl-pct"></span>
      </div>
      <div id="emojiLog" class="wxlog"></div>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="app.js"></script>
  <script src="tgl-local.js"></script>
</body>
</html>
